name: Release

# Push a tag like v0.1.0 to build Windows and macOS apps and attach them to
# a GitHub Release. Fyne needs cgo, so every platform builds natively.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
            target: windows
          - os: macos-latest # Apple Silicon
            name: macos-arm64
            target: darwin
          - os: macos-15-intel # Intel; drop this entry if GitHub retires the runner
            name: macos-amd64
            target: darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Test core
        run: go test ./internal/wow/... ./internal/store/... ./internal/config/... ./internal/syncer/... ./internal/cli/...

      - name: Ensure a C compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v gcc >/dev/null; then choco install mingw -y --no-progress; fi
          gcc --version

      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@v1.7.4

      - name: Package GUI
        working-directory: cmd/wowsync-gui
        run: |
          fyne package -os ${{ matrix.target }} --release --app-version "$VERSION" --app-build "$GITHUB_RUN_NUMBER"
          ls -la

      - name: Build CLI
        run: |
          ext=""; [[ "${{ matrix.target }}" == "windows" ]] && ext=".exe"
          mkdir -p cli
          go build -trimpath -ldflags "-s -w -X github.com/worblood/WoWSync/internal/version.Version=$VERSION" -o "cli/wowsync$ext" ./cmd/wowsync

      - name: Archive
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == "windows" ]]; then
            (cd cmd/wowsync-gui && 7z a "../../dist/WoWSync-${{ matrix.name }}.zip" WoWSync.exe)
            (cd cli && 7z a "../dist/wowsync-cli-${{ matrix.name }}.zip" wowsync.exe)
          else
            ditto -c -k --keepParent cmd/wowsync-gui/WoWSync.app "dist/WoWSync-${{ matrix.name }}.zip"
            tar -C cli -czf "dist/wowsync-cli-${{ matrix.name }}.tar.gz" wowsync
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: wowsync-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
